<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KisanOS · Field Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#b9ae94;
  --bg-2:#e5ac0f;
  --paper:#43a531;
  --ink:#2A3328;
  --ink-soft:#5A6655;
  --ink-faint:#8C9684;
  --leaf:#3E6B3E;
  --leaf-2:#6B9B6B;
  --leaf-soft:#C7D6BD;
  --berry:#B6553A;
  --sun:#D9B66B;
  --line:rgba(42,51,40,0.10);
  --line-2:rgba(42,51,40,0.18);
  --display:'Fraunces', Georgia, serif;
  --body:'Inter', system-ui, sans-serif;
  --hand:'Inter', system-ui, sans-serif;
  --sb-w:280px;
  --spring:cubic-bezier(0.34, 1.56, 0.64, 1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh;font-size:15px;line-height:1.6}
body{
  background-image:
    radial-gradient(1200px 600px at 90% -10%, rgba(217,182,107,0.18), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(107,155,107,0.14), transparent 60%);
}
a{color:var(--leaf)}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0.45;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16 0 0 0 0 0.20 0 0 0 0 0.15 0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ===== Botanical layers — fixed BEHIND content ===== */
.bg-vines{ position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden }
.bg-vines svg{ position:absolute;width:100%;height:100% }
.footer-creeper{
  position:fixed;bottom:-30px;right:-30px;width:380px;height:300px;pointer-events:none;z-index:0;opacity:0.20;
}
.footer-creeper svg{ width:100%;height:100% }

/* climbing vine */
.vine-climb{ fill:none;stroke:var(--leaf);stroke-width:1.4;stroke-linecap:round;
  stroke-dasharray:2400;stroke-dashoffset:2400;animation:vineDraw 4s cubic-bezier(0.5,0,0.3,1) forwards }
.vine-climb.delay{ animation-delay:0.4s;opacity:0.55;stroke:var(--leaf-2) }
.vine-thin{ fill:none;stroke:var(--leaf);stroke-width:0.8;opacity:0.35;stroke-linecap:round;
  stroke-dasharray:2200;stroke-dashoffset:2200;animation:vineDraw 5s ease forwards;animation-delay:0.8s }
@keyframes vineDraw{ to{ stroke-dashoffset:0 } }

.lf{ fill:var(--leaf-2);opacity:0;transform-origin:center;animation:lfPop 0.55s var(--spring) forwards }
@keyframes lfPop{ to{ opacity:0.82 } }
.sway{ transform-box:fill-box;transform-origin:50% 50%;animation:sway 5s ease-in-out infinite }
@keyframes sway{ 0%,100%{ transform:rotate(-3deg) } 50%{ transform:rotate(3deg) } }

/* ===== Layout — content ABOVE botanicals ===== */
.layout{
  position:relative;z-index:2;display:grid;
  grid-template-columns:var(--sb-w) 1fr;gap:0;
  min-height:100vh;
  transition:grid-template-columns 420ms var(--spring);
}
.layout.collapsed{ --sb-w:52px }
@media(max-width:880px){ .layout{ grid-template-columns:1fr } .sidebar{ display:none } }

.main{ min-width:0;padding:28px 40px 120px;max-width:1200px;width:100%;margin:0 auto;position:relative;z-index:3 }
.main > *{ position:relative;z-index:1 }

/* ===== Sidebar ===== */
.sidebar{
  position:sticky;top:0;align-self:start;height:100vh;overflow:hidden;
  background:linear-gradient(180deg, var(--paper) 0%, #F7F1E1 100%);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  width:var(--sb-w);
  transition:width 420ms var(--spring);
  z-index:5;
}
.sb-toggle-host{ position:absolute;top:30px;right:-14px;z-index:10;width:0;height:0;overflow:visible }
.sb-inner{ padding:22px 18px 20px;display:flex;flex-direction:column;gap:18px;flex:1;overflow:hidden }
.sb-toggle{
  position:absolute;top:0;left:-14px;z-index:10;
  width:28px;height:28px;border:none;background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 2px 4px rgba(42,51,40,0.15));transition:transform 0.3s var(--spring);
}
.sb-toggle:hover{ transform:scale(1.12) rotate(-8deg) }
.sb-toggle svg{ width:28px;height:28px }
.sb-toggle .leaf-shape{ fill:var(--leaf-2) }
.sb-toggle .arrow{ stroke:#fff;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round }

.layout.collapsed .sb-content{ opacity:0;pointer-events:none;transition:opacity .18s ease }
.sb-content{ display:flex;flex-direction:column;gap:18px;flex:1;transition:opacity .35s ease .15s;width:240px;flex-shrink:0;overflow:hidden }

/* tiny collapsed leaf icon at top */
.sb-collapsed-icon{
  position:absolute;top:80px;left:50%;transform:translateX(-50%);
  opacity:0;transition:opacity .2s ease;pointer-events:none;
}
.layout.collapsed .sb-collapsed-icon{ opacity:0.7;transition:opacity .35s ease .25s }

.sb-brand{ display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line) }
.brand-name{ font-family:var(--display);font-size:22px;letter-spacing:-0.01em;font-weight:500 }
.brand-name em{ font-style:italic;color:var(--leaf);font-weight:400 }
.brand-tag{ font-size:11px;color:var(--ink-faint);letter-spacing:0.06em;display:flex;align-items:center;gap:6px;margin-top:2px }
.brand-tag .live-dot{ width:6px;height:6px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 3px rgba(62,107,62,0.18);animation:pulse 2s ease-in-out infinite }
@keyframes pulse{ 50%{ box-shadow:0 0 0 6px rgba(62,107,62,0) } }

/* Profile card */
.profile-card{
  background:#FFFCF1;border:1px solid rgba(42,51,40,0.12);border-radius:14px;padding:14px 14px 12px;
  position:relative;
  background-image:repeating-linear-gradient(0deg, transparent 0, transparent 22px, rgba(62,107,62,0.06) 22px, rgba(62,107,62,0.06) 23px);
  box-shadow:0 1px 0 rgba(42,51,40,0.04), inset 0 0 0 1px rgba(255,255,255,0.5);
}
.profile-card::before{
  content:'';position:absolute;top:-6px;left:14px;width:30px;height:14px;
  background:rgba(217,182,107,0.55);border-radius:2px;transform:rotate(-3deg);
  box-shadow:0 1px 2px rgba(42,51,40,0.1);
}
.profile-row{ display:flex;align-items:center;gap:12px;margin-bottom:10px }
.avatar{
  width:46px;height:46px;border-radius:50%;flex:0 0 46px;
  background:linear-gradient(135deg, var(--leaf-soft), var(--leaf-2));
  border:2px solid #baad7f;box-shadow:0 0 0 1px var(--leaf);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;color:var(--ink);
}
.profile-name-input{
  font-family:var(--hand);font-size:18px;font-style:italic;color:var(--ink);background:transparent;border:none;outline:none;
  border-bottom:1px dashed transparent;padding:1px 2px;width:100%;line-height:1.1;
}
.profile-name-input:focus{ border-bottom-color:var(--leaf) }
.profile-field{ display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--ink-soft) }
.profile-field .ic{ width:14px;text-align:center;color:var(--leaf) }
.profile-field input{
  flex:1;font-family:var(--hand);font-size:14px;font-style:italic;color:var(--ink);background:transparent;border:none;outline:none;
  border-bottom:1px dashed transparent;padding:1px 2px;line-height:1.1;
}
.profile-field input:focus{ border-bottom-color:var(--leaf) }

/* language pill */
.lang-pill{
  position:relative;display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:999px;background:rgba(199,214,189,0.4);border:1px solid rgba(62,107,62,0.18);
  font-size:13px;color:var(--ink);cursor:pointer;width:100%;font-family:var(--body);
  transition:all .2s ease;
}
.lang-pill:hover{ background:rgba(199,214,189,0.55) }
.lang-pill .flag{ font-size:14px }
.lang-pill .chev{ margin-left:auto;color:var(--ink-faint);transition:transform .25s ease }
.lang-pill.open .chev{ transform:rotate(180deg) }
.lang-menu{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:#FFFCF1;border:1px solid var(--line-2);border-radius:14px;padding:6px;
  box-shadow:0 12px 32px -10px rgba(42,51,40,0.25);z-index:10;
  display:flex;flex-direction:column;gap:1px;
  animation:bloomIn 220ms var(--spring) both;
}
.lang-menu button{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border:none;background:transparent;cursor:pointer;
  border-radius:9px;text-align:left;font-family:var(--body);font-size:13px;color:var(--ink-soft);
}
.lang-menu button:hover{ background:rgba(199,214,189,0.4);color:var(--ink) }
.lang-menu button.active{ color:var(--leaf);font-weight:500 }

/* ===== Hero ===== */
.page-eyebrow{ font-family:var(--body);font-size:11px;color:var(--ink-faint);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:10px }
.page-title{ font-family:var(--display);font-weight:400;font-size:54px;line-height:1.12;letter-spacing:-0.02em;color:var(--ink);margin:0;padding-bottom:0.08em }
.page-title em{ font-style:italic;color:var(--leaf);font-weight:300 }
.page-lede{ font-size:15px;color:var(--ink-soft);max-width:560px;margin-top:18px;line-height:1.65 }

/* ===== Tab bar ===== */
.tabbar-wrap{ position:sticky;top:14px;z-index:30;display:flex;justify-content:center;margin:24px 0 30px }
.tabbar{
  position:relative;background:#FBF7EC;
  border:1px solid rgba(42,51,40,0.14);border-radius:999px;
  padding:5px;display:inline-flex;gap:2px;
  box-shadow:0 2px 12px -6px rgba(42,51,40,0.18);
  overflow:hidden;
}
.tabbar::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 60'><path d='M-10 30 q 60 -22 120 0 q 60 22 120 0 q 60 -22 120 0 q 60 22 120 0 q 60 -22 120 0' fill='none' stroke='%233E6B3E' stroke-width='0.8' opacity='0.18'/></svg>");
  background-repeat:no-repeat;background-size:100% 100%;background-position:center;
}
.tab-pill{
  position:relative;font-family:var(--body);font-size:0.78rem;font-weight:500;color:var(--ink-soft);
  padding:9px 18px;border-radius:999px;cursor:pointer;border:none;background:transparent;
  display:inline-flex;align-items:center;gap:7px;transition:all 0.2s ease;letter-spacing:0.01em;white-space:nowrap;
}
.tab-pill:hover{ color:var(--ink) }
.tab-pill.active{
  background:#fff;color:var(--ink);
  box-shadow:0 1px 4px rgba(42,51,40,0.10);
  animation:pillBounce 280ms var(--spring) both;
}
.tab-pill.active::before{
  content:'·';color:var(--leaf);font-weight:700;font-size:1rem;line-height:1;
  display:inline-block;margin-right:-2px;animation:leafIn 280ms var(--spring) both;
}
@keyframes pillBounce{ 0%{ transform:scale(1) } 40%{ transform:scale(1.04) } 100%{ transform:scale(1) } }
@keyframes leafIn{ 0%{ transform:scale(0) rotate(-30deg);opacity:0 } 100%{ transform:scale(1) rotate(0);opacity:1 } }

/* ===== Bloom transition ===== */
.tab-content-wrap{ position:relative }
.tab-content{ opacity:1; transform:none }
.tab-content.entering{ animation:tabBloom 280ms var(--spring) both }
.tab-content.leaving{ animation:tabFade 180ms ease forwards }
@keyframes tabBloom{ 0%{ opacity:0; transform:translateY(10px) scale(0.94) } 100%{ opacity:1; transform:translateY(0) scale(1) } }
@keyframes tabFade{ to{ opacity:0; transform:translateY(-4px) } }
@keyframes bloomIn{ 0%{ opacity:0; transform:translateY(6px) scale(0.96) } 100%{ opacity:1; transform:translateY(0) scale(1) } }

/* ===== Card ===== */
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:18px;
  padding:24px 26px;position:relative;overflow:hidden;
  box-shadow:0 1px 0 rgba(42,51,40,0.02), 0 8px 24px -16px rgba(42,51,40,0.12);
  transition:transform .25s ease, box-shadow .25s ease;
}
.card:hover{ transform:translateY(-2px);box-shadow:0 1px 0 rgba(42,51,40,0.02), 0 16px 36px -20px rgba(42,51,40,0.18) }
.card .card-h{ display:flex;align-items:center;justify-content:space-between;margin-bottom:14px }
.card .card-h h3{ font-family:var(--display);font-weight:500;font-size:20px;margin:0;color:var(--ink);letter-spacing:-0.01em }
.card .card-h .meta{ font-size:11px;color:var(--ink-faint);letter-spacing:0.08em;text-transform:uppercase }
.card::before{
  content:'';position:absolute;top:-2px;left:14px;width:30px;height:24px;opacity:0;transform:translateY(-6px) rotate(-12deg);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 24'><path d='M14 22 L14 8' stroke='%233E6B3E' stroke-width='1.2' stroke-linecap='round'/><path d='M14 12 C 6 12, 4 6, 4 6 C 4 6, 8 14, 14 14 Z' fill='%2382B082'/><path d='M14 9 C 22 9, 24 3, 24 3 C 24 3, 20 12, 14 12 Z' fill='%236B9B6B'/></svg>");
  background-repeat:no-repeat;
  transition:all 0.4s var(--spring);
  pointer-events:none;
}
.card:hover::before{ opacity:1;transform:translateY(0) rotate(0) }

/* ===== layout helpers ===== */
.row{ display:flex;gap:18px }
.col{ display:flex;flex-direction:column;gap:18px }
.grid-2{ display:grid;grid-template-columns:1fr 1fr;gap:18px }
.grid-3{ display:grid;grid-template-columns:repeat(3,1fr);gap:18px }
.grid-4{ display:grid;grid-template-columns:repeat(4,1fr);gap:14px }
@media(max-width:900px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr } }

/* form atoms */
.field{ margin-bottom:16px }
.field-label{ display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px }
.field-label .name{ font-size:13px;color:var(--ink-soft) }
.field-label .val{ font-family:var(--display);font-size:18px;color:var(--ink);font-weight:500 }

input[type=range]{ -webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;outline:none;cursor:pointer }
input[type=range]::-webkit-slider-runnable-track{ height:4px;border-radius:4px;background:linear-gradient(90deg, var(--leaf) 0%, var(--leaf) var(--p,50%), rgba(42,51,40,0.10) var(--p,50%)); }
input[type=range]::-moz-range-track{ height:4px;border-radius:4px;background:rgba(42,51,40,0.10) }
input[type=range]::-moz-range-progress{ height:4px;border-radius:4px;background:var(--leaf) }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--paper);border:2px solid var(--leaf);margin-top:-7px;box-shadow:0 2px 6px rgba(62,107,62,0.3);transition:transform .15s ease }
input[type=range]::-moz-range-thumb{ width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--leaf);box-shadow:0 2px 6px rgba(62,107,62,0.3) }
input[type=range]::-webkit-slider-thumb:hover{ transform:scale(1.15) }

.input, select.input, textarea.input{
  width:100%;background:rgba(255,255,255,0.6);border:1px solid var(--line-2);color:var(--ink);
  font-family:var(--body);font-size:14px;padding:10px 14px;border-radius:12px;outline:none;transition:all .2s;
}
.input:focus{ border-color:var(--leaf);background:#fff;box-shadow:0 0 0 3px rgba(62,107,62,0.12) }
select.input{
  appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%233E6B3E' d='M0 0l5 6 5-6z'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:32px;
}

.btn{ font-family:var(--body);font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;cursor:pointer;background:transparent;border:1px solid var(--line-2);color:var(--ink);transition:all .2s ease;display:inline-flex;align-items:center;gap:8px }
.btn:hover{ background:rgba(255,255,255,0.6);border-color:var(--ink-soft) }
.btn.primary{ background:var(--leaf);border-color:var(--leaf);color:#fff;box-shadow:0 4px 14px -4px rgba(62,107,62,0.5) }
.btn.primary:hover{ background:#345A35;border-color:#345A35 }
.btn.ghost{ border-color:transparent;color:var(--ink-soft) }
.btn.ghost:hover{ color:var(--ink) }

.tag{ display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:0.04em;color:var(--leaf);padding:4px 10px;border-radius:999px;background:rgba(107,155,107,0.14);border:1px solid rgba(62,107,62,0.18) }
.tag.warn{ color:#A06B1F;background:rgba(217,182,107,0.18);border-color:rgba(217,182,107,0.4) }
.tag.alert{ color:var(--berry);background:rgba(182,85,58,0.10);border-color:rgba(182,85,58,0.3) }

.bignum{ font-family:var(--display);font-weight:400;font-size:46px;line-height:1;letter-spacing:-0.02em;color:var(--ink) }
.bignum em{ font-style:italic;color:var(--leaf) }
.bignum .unit{ font-size:16px;color:var(--ink-faint);font-style:normal;font-family:var(--body);margin-left:6px }

.bar{ height:6px;background:rgba(42,51,40,0.08);border-radius:99px;overflow:hidden }
.bar > span{ display:block;height:100%;background:var(--leaf);transition:width .8s cubic-bezier(.4,0,.2,1);border-radius:99px }

.muted{ color:var(--ink-faint) }
.small{ font-size:12px }

@keyframes rise{ from{ opacity:0;transform:translateY(8px) } to{ opacity:1;transform:translateY(0) } }
.rise{ animation:rise .6s ease both }
.rise-1{ animation-delay:.1s } .rise-2{ animation-delay:.2s } .rise-3{ animation-delay:.3s } .rise-4{ animation-delay:.4s }

/* location bar */
.locbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:18px;
}
.locbar .pin{ font-size:16px }
.locbar input.input{ width:auto;flex:1;min-width:160px;padding:8px 12px;font-size:13px }
.locbar select.input{ width:auto;padding:8px 32px 8px 12px;font-size:13px }

.drop{ border:2px dashed var(--line-2);border-radius:18px;padding:36px 22px;text-align:center;background:rgba(255,255,255,0.4);transition:all .2s ease;cursor:pointer }
.drop:hover{ border-color:var(--leaf);background:rgba(199,214,189,0.2) }

.tile{ border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .2s ease }
.tile:hover{ border-color:var(--leaf-2);transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(62,107,62,0.25) }
.tile.active{ border-color:var(--leaf);background:rgba(199,214,189,0.35) }

.donut-num{ position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center }
.spark-axis{ font-family:var(--body);font-size:10px;fill:var(--ink-faint) }

/* ===== caterpillar ===== */
.cat-host{ position:fixed;bottom:22px;left:0;width:100%;height:80px;pointer-events:none;z-index:50 }
.cat{ position:absolute;bottom:0;left:0;will-change:transform;transform-origin:center bottom }
.cat .cat-svg{ animation:breathe 3s ease-in-out infinite }
@keyframes breathe{ 0%,100%{ transform:scaleY(1) } 50%{ transform:scaleY(0.97) } }
.cat .seg.body{ animation:bob 0.9s ease-in-out infinite }
.cat .seg.body:nth-of-type(2){ animation-delay:.05s }
.cat .seg.body:nth-of-type(3){ animation-delay:.10s }
.cat .seg.body:nth-of-type(4){ animation-delay:.15s }
.cat .seg.body:nth-of-type(5){ animation-delay:.20s }
.cat .seg.body:nth-of-type(6){ animation-delay:.25s }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-3px) } }
.cat .pupil{ transition:transform .14s ease-out }
.cat.excited .seg.body{ animation-duration:0.45s !important }
.cat.thinking .seg.body{ animation-duration:1.6s !important }

/* tools (hidden by default) */
.cat .tool{ opacity:0;transition:opacity .25s ease }
.cat.tool-wrench .wrench{ opacity:1 }
.cat.tool-lens .lens{ opacity:1 }
.cat.tool-lens .head{ animation:lensLean 1s ease forwards }
@keyframes lensLean{ to{ transform:translate(-2px,-3px) rotate(-8deg) } }
.cat .wrench{ transform-origin:96px 24px;animation:wrenchTwist 0.4s ease-in-out infinite }
.cat:not(.tool-wrench) .wrench{ animation:none }
@keyframes wrenchTwist{ 0%{ transform:rotate(-20deg) } 50%{ transform:rotate(20deg) } 100%{ transform:rotate(-20deg) } }
.cat .glint{ animation:lensGlint 1.5s ease-in-out infinite }
@keyframes lensGlint{ 0%,80%{ opacity:0;transform:translateX(-4px) } 40%{ opacity:0.9;transform:translateX(2px) } 100%{ opacity:0 } }
.cat.tool-wrench .seg.body{ animation:wiggle 0.4s ease-in-out infinite !important }
@keyframes wiggle{ 0%,100%{ transform:translateY(0) rotate(-2deg) } 50%{ transform:translateY(-2px) rotate(2deg) } }
.cat .lid{ transform-origin:center;transform-box:fill-box }
.cat.blink .lid{ animation:blink 0.3s ease }
@keyframes blink{ 0%,100%{ transform:scaleY(0) } 50%{ transform:scaleY(1) } }
.cat.bounce{ animation:satBounce 0.5s var(--spring) }
@keyframes satBounce{ 0%{ transform:translateY(0) } 30%{ transform:translateY(-10px) } 60%{ transform:translateY(0) } 100%{ transform:translateY(0) } }
.cat.antwig .antennae{ animation:antWig 0.5s ease 2 }
@keyframes antWig{ 0%,100%{ transform:rotate(0) } 25%{ transform:rotate(8deg) } 75%{ transform:rotate(-8deg) } }
.cat .antennae{ transform-origin:103px 22px;transform-box:fill-box }

h2{ font-family:var(--display);font-weight:500;font-size:28px;letter-spacing:-0.01em;color:var(--ink);margin:0 0 6px }
h4{ font-family:var(--display);font-weight:500;font-size:16px;color:var(--ink);margin:0 0 6px }
</style>
</head>
<body>

<!-- Botanical layers — fixed BEHIND content -->
<div class="bg-vines" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="none">
    <defs>
      <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#3E6B3E"/>
        <stop offset="100%" stop-color="#82B082"/>
      </linearGradient>
      <linearGradient id="leafGradSoft" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#6B9B6B"/>
        <stop offset="100%" stop-color="#C7D6BD"/>
      </linearGradient>
    </defs>

    <!-- Top-left climbing vine, up sidebar edge and across top -->
    <path class="vine-climb" d="M-20 880 C 60 760, 90 600, 70 460 S 30 240, 80 100 C 110 30, 200 0, 320 20 C 520 50, 760 60, 1000 40 C 1200 25, 1340 30, 1460 50"></path>
    <path class="vine-climb delay" d="M-10 760 C 80 660, 50 480, 100 320 S 180 120, 320 80 C 540 50, 800 90, 1080 80 C 1260 75, 1380 80, 1460 100"></path>

    <!-- Tendrils -->
    <path class="vine-thin" d="M70 440 q 30 -10 50 10"></path>
    <path class="vine-thin" d="M85 280 q 30 -20 60 -10"></path>
    <path class="vine-thin" d="M120 140 q -10 -20 10 -40"></path>
    <path class="vine-thin" d="M260 60 q 0 -20 30 -30"></path>
    <path class="vine-thin" d="M520 50 q 10 -20 30 -10"></path>
    <path class="vine-thin" d="M820 60 q 20 -20 50 -10"></path>
    <path class="vine-thin" d="M1180 50 q 20 -20 40 -10"></path>
    <path class="vine-thin" d="M1420 100 q -20 100 0 220 q 20 120 -10 240 q -20 100 10 220"></path>

    <!-- Many leaves along the vines -->
    <g stroke="#3E6B3E" stroke-width="0.6">
      <!-- left vertical (up sidebar edge) -->
      <g class="lf sway" style="animation-delay:1.6s,0s" transform="translate(80 720) rotate(-30)"><path d="M0 0 C 14 -14, 30 -10, 30 6 C 30 22, 12 28, 0 16 Z" fill="url(#leafGrad)"/></g>
      <g class="lf sway" style="animation-delay:1.7s,0.3s" transform="translate(60 600) rotate(160)"><path d="M0 0 C 14 -14, 30 -10, 30 6 C 30 22, 12 28, 0 16 Z" fill="url(#leafGradSoft)"/></g>
      <g class="lf sway" style="animation-delay:1.8s,0.6s" transform="translate(80 460) rotate(-40)"><path d="M0 0 C 14 -14, 30 -10, 30 6 C 30 22, 12 28, 0 16 Z" fill="url(#leafGrad)"/></g>
      <g class="lf sway" style="animation-delay:1.9s,0.9s" transform="translate(60 320) rotate(150)"><path d="M0 0 C 14 -14, 30 -10, 30 6 C 30 22, 12 28, 0 16 Z" fill="url(#leafGradSoft)"/></g>
      <g class="lf sway" style="animation-delay:2.0s,1.2s" transform="translate(90 180) rotate(-50)"><path d="M0 0 C 14 -14, 30 -10, 30 6 C 30 22, 12 28, 0 16 Z" fill="url(#leafGrad)"/></g>

      <!-- top horizontal -->
      <g class="lf sway" style="animation-delay:2.1s,0.2s" transform="translate(180 70) rotate(-50)"><path d="M0 0 C 12 -12, 26 -8, 26 6 C 26 20, 10 24, 0 14 Z" fill="url(#leafGrad)"/></g>
      <g class="lf sway" style="animation-delay:2.2s,0.5s" transform="translate(360 40) rotate(160)"><path d="M0 0 C 12 -12, 26 -8, 26 6 C 26 20, 10 24, 0 14 Z" fill="url(#leafGradSoft)"/></g>
      <g class="lf sway" style="animation-delay:2.3s,0.8s" transform="translate(540 50) rotate(-60)"><path d="M0 0 C 12 -12, 26 -8, 26 6 C 26 20, 10 24, 0 14 Z" fill="url(#leafGrad)"/></g>
      <g class="lf sway" style="animation-delay:2.4s,1.1s" transform="translate(720 40) rotate(170)"><path d="M0 0 C 12 -12, 26 -8, 26 6 C 26 20, 10 24, 0 14 Z" fill="url(#leafGradSoft)"/></g>
      <g class="lf sway" style="animation-delay:2.5s,1.4s" transform="translate(900 50) rotate(-50)"><path d="M0 0 C 12 -12, 26 -8, 26 6 C 26 20, 10 24, 0 14 Z" fill="url(#leafGrad)"/></g>
      <g class="lf sway" style="animation-delay:2.6s,1.7s" transform="translate(1080 40) rotate(160)"><path d="M0 0 C 12 -12, 26 -8, 26 6 C 26 20, 10 24, 0 14 Z" fill="url(#leafGradSoft)"/></g>
      <g class="lf sway" style="animation-delay:2.7s,2.0s" transform="translate(1260 50) rotate(-50)"><path d="M0 0 C 12 -12, 26 -8, 26 6 C 26 20, 10 24, 0 14 Z" fill="url(#leafGrad)"/></g>

      <!-- right side -->
      <g class="lf sway" style="animation-delay:2.8s,0.4s" transform="translate(1410 200) rotate(-90)"><path d="M0 0 C 12 -12, 26 -8, 26 6 C 26 20, 10 24, 0 14 Z" fill="url(#leafGradSoft)"/></g>
      <g class="lf sway" style="animation-delay:2.9s,0.8s" transform="translate(1410 380) rotate(-90)"><path d="M0 0 C 12 -12, 26 -8, 26 6 C 26 20, 10 24, 0 14 Z" fill="url(#leafGrad)"/></g>
      <g class="lf sway" style="animation-delay:3.0s,1.2s" transform="translate(1410 560) rotate(-90)"><path d="M0 0 C 12 -12, 26 -8, 26 6 C 26 20, 10 24, 0 14 Z" fill="url(#leafGradSoft)"/></g>

      <!-- accent small leaves -->
      <g class="lf sway" style="animation-delay:2.0s,0.1s" transform="translate(120 380) rotate(-10)" opacity="0.6"><path d="M0 0 C 8 -8, 18 -6, 18 4 C 18 14, 6 16, 0 10 Z" fill="url(#leafGradSoft)"/></g>
      <g class="lf sway" style="animation-delay:2.2s,0.4s" transform="translate(110 240) rotate(170)" opacity="0.6"><path d="M0 0 C 8 -8, 18 -6, 18 4 C 18 14, 6 16, 0 10 Z" fill="url(#leafGradSoft)"/></g>
      <g class="lf sway" style="animation-delay:2.4s,0.7s" transform="translate(150 100) rotate(-20)" opacity="0.6"><path d="M0 0 C 8 -8, 18 -6, 18 4 C 18 14, 6 16, 0 10 Z" fill="url(#leafGradSoft)"/></g>
      <g class="lf sway" style="animation-delay:2.6s,1.0s" transform="translate(420 70) rotate(-40)" opacity="0.6"><path d="M0 0 C 8 -8, 18 -6, 18 4 C 18 14, 6 16, 0 10 Z" fill="url(#leafGradSoft)"/></g>
      <g class="lf sway" style="animation-delay:2.8s,1.3s" transform="translate(800 70) rotate(170)" opacity="0.6"><path d="M0 0 C 8 -8, 18 -6, 18 4 C 18 14, 6 16, 0 10 Z" fill="url(#leafGradSoft)"/></g>
      <g class="lf sway" style="animation-delay:3.0s,1.6s" transform="translate(1180 70) rotate(-40)" opacity="0.6"><path d="M0 0 C 8 -8, 18 -6, 18 4 C 18 14, 6 16, 0 10 Z" fill="url(#leafGradSoft)"/></g>
    </g>
  </svg>
</div>

<!-- Bottom-right creeper cluster -->

    <path d="M260 220 C 240 180, 220 160, 200 140 C 180 120, 170 100, 180 80" fill="none" stroke="#3E6B3E" stroke-width="1.6" stroke-linecap="round"/>
    <g fill="url(#creeperGrad)" stroke="#3E6B3E" stroke-width="0.8">

      <path d="M170 200 C 130 180, 130 130, 170 120 C 210 110, 230 160, 200 200 Z"/>
      <path d="M310 240 C 290 220, 290 180, 330 180 C 360 180, 360 220, 340 240 Z"/>
      <path d="M120 240 C 90 220, 90 180, 130 180 C 160 180, 160 220, 140 240 Z"/>
      <path d="M200 130 C 170 110, 180 70, 220 70 C 260 70, 260 110, 230 130 Z"/>
      <path d="M60 270 C 30 250, 30 220, 70 220 C 100 220, 100 250, 80 270 Z"/>
    </g>

</div>

<div id="root"></div>
